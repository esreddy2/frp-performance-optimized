name: Semgrep

on:
  push:
    branches: [ main, dev ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif
      - name: Drop nosemgrep-suppressed results and summarize
        if: always()
        # Semgrep keeps `// nosemgrep` matches in SARIF with an "accepted"
        # suppression, but GitHub code scanning still opens alerts for them.
        # Remove them so in-source suppressions are the single source of truth
        # and GitHub marks those alerts fixed.
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, os
          if not os.path.exists("semgrep.sarif"):
              print("## Semgrep\n\nNo SARIF produced (scan failed).")
              raise SystemExit
          sarif = json.load(open("semgrep.sarif"))
          active, suppressed = [], 0
          for run in sarif["runs"]:
              kept = [r for r in run.get("results", []) if not r.get("suppressions")]
              suppressed += len(run.get("results", [])) - len(kept)
              run["results"] = kept
              active += kept
          json.dump(sarif, open("semgrep.sarif", "w"))
          print(f"## Semgrep: {len(active)} unsuppressed finding(s), {suppressed} suppressed via nosemgrep\n")
          print("New and fixed alerts are tracked in the Security > Code scanning tab (category `semgrep`).\n")
          if active:
              print("| Rule | Count |\n|---|---|")
              for rule, n in collections.Counter(r["ruleId"] for r in active).most_common():
                  print(f"| `{rule}` | {n} |")
          EOF
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
